[tox]
# This fork exists to run Wagtail 7 under Django 5.2, which is the one
# combination the matrix never covered: it tested Django 4.2/5.0 against
# Wagtail 5.2 to 6.2 while setup.py declares wagtail>=5.2,<7.1 and every
# consumer of it (pure-cms, and purecreative through it) runs Wagtail 7 on
# Python 3.12. The older rows are dropped rather than kept green, since
# nothing installs this fork on them.
envlist =
    py{312,313}-dj52-wt70
    flake8
    black

[gh-actions]
python =
    3.12: py312-dj52-wt70, flake8, black
    3.13: py313-dj52-wt70

[flake8]
max-line-length = 120

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}
    DJANGO_SETTINGS_MODULE = tests.testapp.settings

commands =
    pytest --create-db --no-migrations

deps =
    pytest==8.0.0
    pytest-django==4.8.0
    requests==2.32.0
    model-bakery==1.17.0
    ipdb==0.13.13
    django-el-pagination==4.0
    tapioca-disqus==0.1.2
    dj52: Django>=5.2,<5.3
    wt70: wagtail>=7.0,<7.1

[testenv:flake8]
basepython = python3.12
deps = flake8==7.0.0
commands = flake8 puput tests --exclude=migrations

[testenv:black]
basepython = python3.12
deps = black==24.1.1
commands = black puput tests -l 120 --check --extend-exclude=/migrations/
