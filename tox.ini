[tox]
# This fork exists to run puput on the Wagtail and Django lines Pure Stack
# deploys, which upstream's matrix never covered. One fork release has to
# install on both sides of pure-cms 4: the 3.x stack on Wagtail 7.4 LTS with
# Django 5.2, and the v4 stack on Wagtail 8.1 with Django 5.2 or 6.1. Pure
# Stack requires Python 3.13, so that is the only Python tested.
envlist =
    py313-dj52-wt74
    py313-dj{52,61}-wt81
    flake8
    black

[gh-actions]
python =
    3.13: py313-dj52-wt74, py313-dj52-wt81, py313-dj61-wt81, flake8, black

[flake8]
max-line-length = 120

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}
    DJANGO_SETTINGS_MODULE = tests.testapp.settings

commands =
    pytest --create-db --no-migrations

deps =
    pytest==8.0.0
    pytest-django==4.8.0
    requests==2.32.0
    model-bakery==1.17.0
    ipdb==0.13.13
    django-el-pagination==4.0
    tapioca-disqus==0.1.2
    dj52: Django>=5.2,<5.3
    dj61: Django>=6.1,<6.2
    wt74: wagtail>=7.4,<7.5
    wt81: wagtail>=8.1,<8.2

[testenv:flake8]
basepython = python3.13
deps = flake8==7.0.0
commands = flake8 puput tests --exclude=migrations

[testenv:black]
basepython = python3.13
deps = black==24.1.1
commands = black puput tests -l 120 --check --extend-exclude=/migrations/
